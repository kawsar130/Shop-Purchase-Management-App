name: Build & Package Android Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Release Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testProdDebugUnitTest --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintProdDebug

      - name: Build Release APK and App Bundle (AAB)
        run: ./gradlew assembleProdRelease bundleProdRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ShopKeeper-Prod-Release-APK
          path: app/build/outputs/apk/prod/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: ShopKeeper-Prod-Release-AAB
          path: app/build/outputs/bundle/prodRelease/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload Proguard Mapping
        uses: actions/upload-artifact@v4
        with:
          name: ShopKeeper-Prod-Release-Mapping
          path: app/build/outputs/mapping/prodRelease/mapping.txt
          if-no-files-found: warn
          retention-days: 14
