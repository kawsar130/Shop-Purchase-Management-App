name: CI Quality Gate

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality_gate:
    name: Test, Lint & Release Compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run Unit Tests (25/25)
        run: ./gradlew testProdDebugUnitTest --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintProdDebug

      - name: Verify Production R8 Assembly
        run: ./gradlew assembleProdRelease --stacktrace

      - name: Upload Test Reports (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-results
          path: app/build/reports/tests/testProdDebugUnitTest/
          retention-days: 7

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results
          path: app/build/reports/lint-results-prodDebug.html
          retention-days: 14
