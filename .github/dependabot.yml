version: 2
updates:
  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]

  # Maintain Gradle build dependencies & version catalog
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 3
    groups:
      gradle-dependencies:
        patterns: ["*"]
    ignore:
      # Restrict all automated Gradle updates to patch/bugfix versions only.
      # Major and minor framework upgrades are executed intentionally in dedicated sprints.
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
