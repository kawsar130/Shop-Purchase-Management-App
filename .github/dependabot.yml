version: 2
updates:
  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]

  # Maintain Gradle build dependencies & version catalog
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 3
    groups:
      gradle-dependencies:
        patterns: ["*"]
    ignore:
      # Defer major language/framework version jumps to planned migration sprints
      - dependency-name: "org.jetbrains.kotlin.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "androidx.compose.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "androidx.compose.compiler:compiler"
        update-types: ["version-update:semver-major"]
      - dependency-name: "androidx.room:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.tools.build:gradle"
        update-types: ["version-update:semver-major"]
      - dependency-name: "androidx.datastore:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "androidx.hilt:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.google.dagger:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.google.firebase:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.google.android.libraries.identity.googleid:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
